<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drifthood | AI-Powered REST Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 231, 235, 0.5);
        }
        .ai-glow {
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }
        pre {
            background: #1e293b;
            color: #f8fafc;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            font-size: 0.875rem;
        }
    </style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen pb-20">

    <!-- Header / Logo Section -->
    <header class="max-w-4xl mx-auto pt-12 px-6 text-center">
        <div id="logo-container" class="inline-block p-8 bg-white rounded-3xl shadow-sm mb-6 transition-all duration-500">
            <div id="logo-svg-wrapper">
                <svg id="drifthood-logo" width="160" height="100" viewBox="0 0 200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path id="branch-1" d="M20 75C40 65 65 85 95 75C125 65 150 90 180 80" stroke="#5d4037" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                    <path id="branch-2" d="M75 76C85 60 110 45 130 50" stroke="#5d4037" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path id="branch-3" d="M140 83C150 95 170 100 185 95" stroke="#8d6e63" stroke-width="6" stroke-linecap="round" />
                    <circle cx="55" cy="74" r="2" fill="#3e2723" />
                    <circle cx="110" cy="68" r="1.5" fill="#3e2723" />
                </svg>
            </div>
        </div>
        <h1 class="text-4xl font-black text-stone-800 tracking-tight">Drifthood</h1>
        <p class="text-stone-500 mt-2">The organic REST API workbench.</p>

        <div class="mt-6 flex justify-center gap-3">
            <button onclick="copySvg()" class="px-4 py-2 bg-stone-200 hover:bg-stone-300 rounded-full text-sm font-medium transition-colors">
                Copy SVG
            </button>
            <div id="copy-toast" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 bg-stone-800 text-white px-6 py-3 rounded-full shadow-xl">
                Copied to clipboard!
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto mt-12 px-6 grid grid-cols-1 md:grid-cols-2 gap-8">

        <!-- AI Feature 1: Style Generator -->
        <section class="glass-card p-6 rounded-2xl ai-glow">
            <div class="flex items-center gap-2 mb-4">
                <span class="text-xl">✨</span>
                <h2 class="font-bold text-lg text-stone-800">Logo Stylizer</h2>
            </div>
            <p class="text-sm text-stone-600 mb-4">Redesign the driftwood using AI themes.</p>
            <div class="flex gap-2">
                <input type="text" id="theme-input" placeholder="e.g. Neon Cyberpunk, Minimalist Blue" class="flex-1 px-4 py-2 rounded-lg border border-stone-200 text-sm focus:ring-2 focus:ring-violet-500 outline-none">
                <button onclick="stylizeLogo()" id="stylize-btn" class="bg-violet-600 hover:bg-violet-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition-all">
                    ✨ Apply
                </button>
            </div>
            <div id="ai-status" class="mt-3 text-xs text-stone-400 italic min-h-[1rem]"></div>
        </section>

        <!-- AI Feature 2: Request Generator -->
        <section class="glass-card p-6 rounded-2xl ai-glow">
            <div class="flex items-center gap-2 mb-4">
                <span class="text-xl">✨</span>
                <h2 class="font-bold text-lg text-stone-800">Request Architect</h2>
            </div>
            <p class="text-sm text-stone-600 mb-4">Describe an API task to generate code.</p>
            <textarea id="request-desc" placeholder="e.g. GET request to JSONPlaceholder for user with ID 5" class="w-full px-4 py-2 rounded-lg border border-stone-200 text-sm focus:ring-2 focus:ring-violet-500 outline-none h-20 mb-3"></textarea>
            <button onclick="generateRequest()" id="gen-btn" class="w-full bg-stone-800 hover:bg-black text-white px-4 py-2 rounded-lg text-sm font-bold transition-all">
                ✨ Generate Request
            </button>
        </section>

        <!-- Output Section (Full Width) -->
        <section id="ai-output-container" class="hidden md:col-span-2 glass-card p-6 rounded-2xl animate-in fade-in slide-in-from-bottom-4 duration-500">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-stone-800">✨ AI Result</h3>
                <button onclick="document.getElementById('ai-output-container').classList.add('hidden')" class="text-stone-400 hover:text-stone-600">&times;</button>
            </div>
            <div id="ai-output-content"></div>
        </section>
    </main>

    <script>
        const apiKey = ""; // Provided at runtime
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'drifthood-tool';

        async function callGemini(prompt, systemPrompt = "You are a helpful coding assistant.") {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (err) {
                    await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
                }
            }
            throw new Error("Failed to connect to AI after retries.");
        }

        async function stylizeLogo() {
            const theme = document.getElementById('theme-input').value || "Random modern";
            const btn = document.getElementById('stylize-btn');
            const status = document.getElementById('ai-status');

            btn.disabled = true;
            status.textContent = "✨ Drifting through ideas...";

            const prompt = `Return ONLY a valid JSON object with keys: branch1Color, branch2Color, branch3Color, dotColor, backgroundColor. Theme: ${theme}. Colors should be hex codes.`;
            const system = "You are a UI designer. Output only raw JSON.";

            try {
                const result = await callGemini(prompt, system);
                const colors = JSON.parse(result.replace(/```json|```/g, '').trim());

                // Apply colors to SVG
                document.getElementById('branch-1').setAttribute('stroke', colors.branch1Color);
                document.getElementById('branch-2').setAttribute('stroke', colors.branch2Color);
                document.getElementById('branch-3').setAttribute('stroke', colors.branch3Color);
                document.getElementById('logo-container').style.backgroundColor = colors.backgroundColor;

                status.textContent = `Applied ${theme} style!`;
            } catch (err) {
                status.textContent = "Could not reach the driftwood spirits.";
            } finally {
                btn.disabled = false;
            }
        }

        async function generateRequest() {
            const desc = document.getElementById('request-desc').value;
            if (!desc) return;

            const btn = document.getElementById('gen-btn');
            const outputContainer = document.getElementById('ai-output-container');
            const outputContent = document.getElementById('ai-output-content');

            btn.innerText = "✨ Consulting Docs...";
            btn.disabled = true;

            try {
                const prompt = `Create a clean, ready-to-use cURL and JavaScript fetch example for: "${desc}". Use Markdown.`;
                const result = await callGemini(prompt, "You are an API expert. Provide concise code examples.");

                outputContainer.classList.remove('hidden');
                outputContent.innerHTML = `<div class="prose prose-stone max-w-none text-sm">${formatMarkdown(result)}</div>`;
                outputContainer.scrollIntoView({ behavior: 'smooth' });
            } catch (err) {
                outputContent.innerHTML = `<p class="text-red-500">Error generating request. Please try again.</p>`;
            } finally {
                btn.innerText = "✨ Generate Request";
                btn.disabled = false;
            }
        }

        function formatMarkdown(text) {
            // Simple markdown-to-html converter for code blocks
            return text
                .replace(/```(javascript|bash|curl|json)?/g, '<pre>')
                .replace(/```/g, '</pre>')
                .replace(/\n/g, '<br>');
        }

        function copySvg() {
            const svgContent = document.getElementById('logo-svg-wrapper').innerHTML.trim();
            const el = document.createElement('textarea');
            el.value = svgContent;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            const toast = document.getElementById('copy-toast');
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2000);
        }
    </script>
</body>
</html>
